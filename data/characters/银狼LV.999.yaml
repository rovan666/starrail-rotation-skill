    type: 弹射
    multiplier: "2.4 总计（100 段均分）+ 1.0 最后一击（全体均分）（Lv6）"
    toughness: "0.02×100 段 + 3 最后一击（bwiki：0.2×100+30 点，合计 5 格）"
    desc: "每弹射一定段数暂停并触发 1 次盲盒（共 3 次，此方式触发不视为攻击）；若对所有敌人造成致命伤害，存在可攻击目标后获得 1 个额外回合并按剩余段数再次施放；每回合首次触发时自身所有增益延长 1 回合；每 60 点隐藏分期间伤害+15%（最多 2 层，120 点吃满）。无法恢复战技点。回能 bwiki 未标注，暂按 20 待实测。"
  欢愉技:
    type: 强化
    toughness: 0
    参演编号: 999
    desc: "【殿堂级操作回放】获得 15 隐藏分；无敌玩家期间变为【崩坏级伤害演示】：弹射欢愉伤害 90%×6 段（Lv10），削韧 1 格（bwiki 10 点）。行迹「真结局解锁条件」：触发欢愉技时笑点大于一定值可额外获得隐藏分（阈值攻略口径 20~40+，待核）。"
  秘技:
    type: 召唤
    toughness: 0
    desc: "召唤【怪怪怪味豆】自动索敌秒小怪；在场时进战后每个波次开始触发 1 次盲盒（固定计入好活当赏）。"
ult_mode: 特殊             # 隐藏分激活型变身，类似流萤的激活型但资源为隐藏分
talent:
  - "隐藏分 ≥60 可激活终结技，溢出上限 240；每点隐藏分暴击率+0.4%（Lv10），满暴后每点改 +0.8% 暴伤"
  - "无敌玩家：免疫控制、无法施放终结技、获得强化普攻与强化欢愉技；完整施放 3 次强化普攻后退出并清空隐藏分"
  - "行迹「假结局速通攻略」：速度 ≥160 时欢愉度+50%，每超 1 点再 +2%，至多计入 100 点超出速度（260 速吃满）"
  - "行迹「隐藏关卡全成就」：进入无敌玩家后获得 20 隐藏分"
buffs:
