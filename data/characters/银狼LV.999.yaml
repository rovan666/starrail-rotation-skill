  终结技:
    type: 强化
    toughness: 0
    desc: "进入【无敌玩家】并行动提前 100%：展开结界，持有好活当赏时我方每消耗 1 战技点有概率触发【头号补给盲盒】——90% 欢愉伤害全体均分（Lv10），并随机触发【超超超大剑】（对生命最高目标额外造成本次总伤害 20% 真实伤害）/【爆爆爆炸蛋】（回 2 战技点，点数少时概率升高）/【怪怪怪味豆】（获 3 笑点，隐藏分少时概率升高）；初始固定概率 100%，成功触发后下次降为当前概率的 20%。"
