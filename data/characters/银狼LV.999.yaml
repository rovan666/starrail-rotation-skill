  1: "以太编辑：结界内敌人 20% 易伤；大招结束返还 20% 隐藏分（永续变身关键）"
  2: "是机制，不是BUG：开大增益延长 1 回合；本次状态每累计 120 隐藏分获得 1 额外回合+恢复 1 次强化普攻次数（N 连动核心）"
  4: "强化欢愉技额外计入 5 倍笑点"
  6: "我独自满级：强化普攻 50% 增笑；敌人入场植入【禁限弱点】（全属性弱点+全基础抗性降为 0，原 0 抗的改降 20%）"
